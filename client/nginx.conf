# Serves the built client and forwards the API paths to the server service,
# so the browser talks to a single origin (same paths as the Vite dev proxy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /auth/ {
    proxy_pass http://server:3000;
  }

  location = /health {
    proxy_pass http://server:3000;
  }

  # Both API paths and client pages: a browser asking for HTML gets the app,
  # the client's API calls (Accept: application/json) go to the server.
  location ~ ^/(readings|reports)(/|$) {
    if ($http_accept ~* "text/html") {
      rewrite ^ /index.html last;
    }
    proxy_pass http://server:3000;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes such as /dashboard or /login.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

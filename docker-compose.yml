# Local stack: PostgreSQL, the API and the built client behind nginx.
# Open http://localhost:8080 after `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://sweety:sweety@db:5432/sweety
      # Dev-only default. Set JWT_SECRET for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # The browser reaches the API through the client's nginx on port 8080.
      CLIENT_ORIGIN: http://localhost:8080
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db-data:
